<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Renji 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f4f5f8;font-family:system-ui,Tahoma,Arial}
header{padding:14px 16px;background:#191f2b}h1{font-size:22px;margin:0}p{color:#bac4d4;font-size:13px;margin:5px 0}
#stage{height:58vh;min-height:330px;background:#151c29;position:relative}canvas{width:100%;height:100%;display:block}
#status{position:absolute;top:10px;right:10px;background:#111b;padding:8px 11px;border-radius:10px;font-size:12px}
.controls{padding:14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:650px;margin:auto}
button{border:0;border-radius:12px;padding:13px;background:#27364b;color:white;font-size:15px;font-weight:600}
.primary{background:#1769d2}button:disabled{opacity:.45}label{grid-column:1/-1;font-size:13px;color:#d5dbea}input{width:100%}
.note{max-width:650px;margin:auto;padding:0 16px 18px;color:#aeb9ca;font-size:12px;line-height:1.7}
</style></head>
<body>
<header><h1>Renji 3D</h1><p>عارض رنجي — تدوير وتكبير وتجربة قفزة</p></header>
<div id="stage"><div id="status">جارٍ تحميل رنجي…</div></div>
<div class="controls">
<button class="primary" id="jump" disabled>▶ قفزة</button><button id="stop" disabled>■ إيقاف</button>
<button id="reset" disabled>↺ إعادة الوضع</button><button id="turn" disabled>⟳ تدوير تلقائي</button>
<label>سرعة الحركة: <span id="sv">1.0×</span><input id="speed" type="range" min=".5" max="1.8" step=".1" value="1"></label>
</div>
<div class="note">اسحب بإصبعك لتدوير الكاميرا واستخدم إصبعين للتكبير. القفزة هنا تجريبية بتحريك المجسم ككل؛ لا تغيّر مفاصل الجسم. يمكن لاحقًا إضافة حركة مفاصل أدق بعد فحص أسماء العظام.</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x151c29);
const camera=new THREE.PerspectiveCamera(38,stage.clientWidth/stage.clientHeight,.01,1000);camera.position.set(2.8,2.1,4.5);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x536078,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,4);scene.add(light);scene.add(new THREE.GridHelper(10,20,0x52627a,0x29384d));
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let model=null,baseY=0,playing=false,elapsed=0,turn=false;
const modelUrl='https://d8j0ntlcm91z4.cloudfront.net/user_3LmXyDoFW8yejECG5iO6snaTTRW/hf_20261108_173936_cf5fdf10-579c-4d80-8ac1-faf24e7d6d5c.glb';
new GLTFLoader().load(modelUrl,g=>{model=g.scene;scene.add(model);model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),size=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());model.position.x-=c.x;model.position.z-=c.z;model.position.y-=b.min.y;model.scale.setScalar(2.2/(Math.max(size.x,size.y,size.z)||1));baseY=model.position.y;controls.target.set(0,size.y*.35,0);camera.position.set(2.8,1.9,4.5);controls.update();status.textContent='تم تحميل رنجي';['jump','stop','reset','turn'].forEach(id=>document.getElementById(id).disabled=false);},undefined,e=>{console.error(e);status.textContent='تعذّر تحميل النموذج. افتح الصفحة في Chrome.'});
document.querySelector('#jump').onclick=()=>{if(model){elapsed=0;playing=true}};
document.querySelector('#stop').onclick=()=>{playing=false;if(model)model.position.y=baseY};
document.querySelector('#reset').onclick=()=>{playing=false;if(model){model.position.y=baseY;model.rotation.set(0,0,0)}};
document.querySelector('#turn').onclick=()=>{turn=!turn;document.querySelector('#turn').textContent=turn?'إيقاف التدوير':'⟳ تدوير تلقائي'};
document.querySelector('#speed').oninput=e=>document.querySelector('#sv').textContent=(+e.target.value).toFixed(1)+'×';
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(playing&&model){elapsed+=dt*Number(document.querySelector('#speed').value);const t=elapsed/1.35;if(t>=1){playing=false;model.position.y=baseY}else{model.position.y=baseY+Math.sin(Math.PI*t)*.75}}if(turn&&model)model.rotation.y+=dt*.7;controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
</script></body></html>
